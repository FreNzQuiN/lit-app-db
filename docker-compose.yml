name: lit-app-db

# Versi lite: 12 kontainer, perkiraan RAM terpakai +-1,5-2 GB.
# MongoDB  : 1 config server + 2 shard (tiap shard 1 primary + 1 secondary) + mongos
# Redis    : 2 pasang master-slave (s1 = tenant ub, s2 = tenant unair)
# Typesense: 1 node
# Neo4j    : 1 instance Community Edition

x-mongod: &mongod
  image: mongo:7.0
  networks: [litnet]
  mem_limit: 300m
  restart: unless-stopped

x-redis: &redis
  image: redis:7-alpine
  networks: [litnet]
  mem_limit: 64m
  restart: unless-stopped

networks:
  litnet:
    driver: bridge

volumes:
  cfg1-data:
  rs1p-data:
  rs1s1-data:
  rs2p-data:
  rs2s1-data:
  redis-s1m-data:
  redis-s1s-data:
  redis-s2m-data:
  redis-s2s-data:
  ts1-data:
  neo4j-data:

services:
  cfg1:
    <<: *mongod
    command: ["mongod", "--configsvr", "--replSet", "cfgRS", "--bind_ip_all", "--port", "27017", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: ["cfg1-data:/data/db"]

  shard1p:
    <<: *mongod
    command: ["mongod", "--shardsvr", "--replSet", "rs1", "--bind_ip_all", "--port", "27017", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: ["rs1p-data:/data/db"]

  shard1s1:
    <<: *mongod
    command: ["mongod", "--shardsvr", "--replSet", "rs1", "--bind_ip_all", "--port", "27017", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: ["rs1s1-data:/data/db"]

  shard2p:
    <<: *mongod
    command: ["mongod", "--shardsvr", "--replSet", "rs2", "--bind_ip_all", "--port", "27017", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: ["rs2p-data:/data/db"]

  shard2s1:
    <<: *mongod
    command: ["mongod", "--shardsvr", "--replSet", "rs2", "--bind_ip_all", "--port", "27017", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: ["rs2s1-data:/data/db"]

  mongos:
    image: mongo:7.0
    command: ["mongos", "--configdb", "cfgRS/cfg1:27017", "--bind_ip_all", "--port", "27017"]
    ports: ["27017:27017"]
    volumes: ["./scripts/mongo:/scripts:ro"]
    networks: [litnet]
    mem_limit: 400m
    restart: unless-stopped
    depends_on: [cfg1, shard1p, shard1s1, shard2p, shard2s1]

  redis-s1m:
    <<: *redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "48mb", "--maxmemory-policy", "volatile-lru"]
    volumes: ["redis-s1m-data:/data"]

  redis-s1s:
    <<: *redis
    command: ["redis-server", "--replicaof", "redis-s1m", "6379", "--appendonly", "yes", "--maxmemory", "48mb", "--maxmemory-policy", "volatile-lru"]
    volumes: ["redis-s1s-data:/data"]
    depends_on: [redis-s1m]

  redis-s2m:
    <<: *redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "48mb", "--maxmemory-policy", "volatile-lru"]
    volumes: ["redis-s2m-data:/data"]

  redis-s2s:
    <<: *redis
    command: ["redis-server", "--replicaof", "redis-s2m", "6379", "--appendonly", "yes", "--maxmemory", "48mb", "--maxmemory-policy", "volatile-lru"]
    volumes: ["redis-s2s-data:/data"]
    depends_on: [redis-s2m]

  typesense1:
    image: typesense/typesense:0.25.2
    command: ["--data-dir=/data", "--api-key=${TYPESENSE_API_KEY:-litapp-secret}", "--api-port=8108", "--enable-cors"]
    ports: ["18108:8108"]
    volumes: ["ts1-data:/data"]
    networks: [litnet]
    mem_limit: 200m
    restart: unless-stopped

  neo4j:
    image: neo4j:5.20-community
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-litapp-pass}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 384m
      NEO4J_server_memory_pagecache_size: 64m
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j-data:/data", "./scripts/neo4j:/scripts:ro"]
    networks: [litnet]
    mem_limit: 700m
    restart: unless-stopped
